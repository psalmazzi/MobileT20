<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#15181D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Combate T20</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315181D'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23E0B84F' font-family='sans-serif' font-weight='800'%3E20%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#0B0D10;--surface:#13161B;--surface-2:#1B1F25;--surface-3:#232830;--border:#20252C;--border-strong:#3A424D;
  --text:#E8EAED;--text-2:#9AA3AF;--text-3:#7C8693;
  --pv:#FF6B70;--pv-temp:#FFA94D;--pm:#5AA2FF;--pm-temp:#67E8F9;
  --ok:#4ADE80;--warn:#FFB86B;--danger:#FF6B70;--danger-bg:#2A0F12;--crit:#FFD60A;--accent:#E0B84F;
  --btn-dano:#A3262D;--btn-cura:#1E6E47;--btn-temp:#8A3A16;--btn-pm:#2457C5;
  --r:14px;--ease:cubic-bezier(.2,.8,.2,1);
  --tabs:64px;
  color-scheme:dark;
}
html.oled{--bg:#000;--surface:#0C0E11;--surface-2:#15181D;--surface-3:#1D2128}
html.grande{font-size:115%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:16px;line-height:1.4}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* HUD (Ataques/Efeitos) */
.hud{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 20px 8px;padding-top:calc(12px + env(safe-area-inset-top))}
.hud.caido{background:var(--danger-bg)} .hud.morto{background:#1E1E1E}
.hud-linha{display:flex;align-items:center;gap:12px;min-height:28px;width:100%;text-align:left}
.hud-rot{width:24px;font-size:.75rem;font-weight:600;color:var(--text-3)}
.hud-val{min-width:84px;text-align:right;font-weight:700}
.hud-val small{color:var(--text-3);font-weight:500;font-size:.8rem}
.hud-rodape{display:flex;align-items:center;gap:8px;margin-top:4px}
.rodada-btn{font-size:.85rem;color:var(--text-2);min-height:40px}
.mini-chips{flex:1;display:flex;gap:6px;overflow:hidden;white-space:nowrap}
.mini-chip{font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--warn)}
.mini-chip.perigo{background:var(--danger-bg);color:#FFB4B4}
.icon-btn{width:44px;height:44px;border-radius:12px;font-size:1.3rem;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.icon-btn.ghost{background:none}
.icon-btn:disabled{opacity:.25}
.faixa-caido,.faixa{margin-top:6px;font-size:.82rem;font-weight:600;color:#FFB4B4}
.faixa{background:var(--danger-bg);border-radius:10px;padding:8px 12px;margin:0 0 10px}

/* barras */
.barra{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex}
.barra i{display:block;height:100%;transition:width .25s var(--ease)}
.barra .pv{background:var(--pv)} .barra .pm{background:var(--pm)}
.barra .tpv{background:repeating-linear-gradient(45deg,var(--pv-temp) 0 4px,#B8722E 4px 8px)}
.barra .tpm{background:repeating-linear-gradient(45deg,var(--pm-temp) 0 4px,#35A9BC 4px 8px)}
.pulsa{animation:pulsa 1.6s infinite}
@keyframes pulsa{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pulsa{animation:none}*{transition:none!important}}

/* conteúdo */
main{flex:1;padding:16px 20px 160px}
.tit{font-size:.75rem;letter-spacing:.04em;color:var(--text-3);margin:28px 0 12px;font-weight:600}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px}
.muted{color:var(--text-2)} .dim{color:var(--text-3)} .small{font-size:.86rem} .xs{font-size:.76rem}
.ok{color:var(--ok)} .ruim{color:var(--danger)} .aviso{color:var(--warn)} .critc{color:var(--crit)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1}
.sep{height:1px;background:var(--border);margin:14px 0}

/* ── aba Vida: cabe na tela ── */
main.vida{display:flex;flex-direction:column;height:calc(100vh - var(--tabs) - env(safe-area-inset-bottom));height:calc(100dvh - var(--tabs) - env(safe-area-inset-bottom));min-height:520px;padding:calc(8px + env(safe-area-inset-top)) 20px 12px;gap:12px}
.vida-topo{display:flex;align-items:center;justify-content:space-between}
.recursos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border-radius:var(--r);padding:14px 16px 16px;text-align:left;border:1.5px solid transparent;transition:border-color .15s}
.rcard.sel{border-color:var(--border-strong);background:var(--surface-2)}
.rcard.pv.sel{border-color:rgba(255,107,112,.55)} .rcard.pm.sel{border-color:rgba(90,162,255,.55)}
.rc-rot{font-size:.75rem;font-weight:600;color:var(--text-3);letter-spacing:.04em}
.rc-num{font-size:clamp(2.2rem,11vw,3rem);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.rcard.pv .rc-num{color:var(--pv)} .rcard.pm .rc-num{color:var(--pm)}
.rc-temp{font-size:.5em;font-weight:700;margin-left:4px;vertical-align:.5em}
.rcard.pv .rc-temp{color:var(--pv-temp)} .rcard.pm .rc-temp{color:var(--pm-temp)}
.rc-max{font-size:.8rem;color:var(--text-3);margin-bottom:10px}
.rcard .barra{width:100%;flex:none}
.rcard.critico .rc-num{animation:pulsa 1.6s infinite}
.rcard.caido{background:var(--danger-bg)}
.rcard.vazio .rc-num{color:var(--text-3)}
.visor-linha{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 0;min-height:52px}
.previa{font-size:.86rem;color:var(--text-2);padding-bottom:6px}
.visor{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.visor.pv{color:var(--text)} .visor.pm{color:var(--text)}
.teclado{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr;grid-auto-rows:1fr;gap:10px;min-height:0}
.tecla{border-radius:var(--r);background:var(--surface);font-size:1.55rem;font-weight:600;min-height:48px}
.tecla:active{background:var(--surface-3)}
.acao{border-radius:var(--r);font-weight:700;font-size:.98rem;color:#fff;min-height:48px}
.acao:active{filter:brightness(.85)}
.acao:disabled{opacity:.28}
.acao.dano{background:var(--btn-dano)} .acao.cura{background:var(--btn-cura)} .acao.temp{background:var(--btn-temp)} .acao.gasto{background:var(--btn-pm)}
.acao.meio{background:var(--surface-2);color:var(--text-2);font-size:1.3rem}
.vida-rodape{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--text-3)}
.vida-rodape button{min-height:36px;color:var(--text-2)}
.vida-rodape b{color:var(--text);font-weight:700}

/* botões genéricos */
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--surface-2);font-weight:600}
.btn.pri{background:var(--accent);color:#1A1300}
.btn.ghost{background:transparent;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border-strong)}
.btn.perigo{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.btn.full{width:100%}
.btn:disabled{opacity:.35}
.btn:active{filter:brightness(.88)}
.link{color:var(--accent);font-weight:600;min-height:40px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;color:var(--text-3);font-size:.9rem}
.seg button.on{background:var(--surface-3);color:var(--text)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -20px;padding-left:20px;padding-right:20px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;background:var(--surface);font-size:.86rem;font-weight:500;white-space:nowrap;color:var(--text-2)}
.chip.on{background:var(--accent);color:#1A1300;font-weight:600}
.chip.bloq{color:var(--text-3);box-shadow:inset 0 0 0 1px var(--border) ;background:transparent}
.chip.na{text-decoration:line-through;color:var(--text-3);background:transparent}
.chip small{font-weight:400;opacity:.75}

/* armas */
.arma{padding:18px}
.arma-nome{font-weight:700;font-size:1.05rem;text-align:left}
.selo{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px}
.selo.neg{background:var(--danger-bg);color:#FFB4B4} .selo.pos{background:#0F2418;color:var(--ok)}
.stats3{display:grid;grid-template-columns:auto 1fr auto;gap:16px;margin:16px 0}
.stats3 button{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.stats3 small{font-size:.72rem;color:var(--text-3);font-weight:500}
.stats3 b{font-size:1.2rem;font-weight:700}
.arma-acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arma.bloqueada{opacity:.5}
.input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;color:var(--text);font:inherit}
.input:focus{outline:none;border-color:var(--border-strong)}
.input.mini{width:76px;text-align:center}
select.input{appearance:auto}
label.campo{display:block;margin-bottom:14px}
label.campo>span{display:block;font-size:.76rem;color:var(--text-3);margin-bottom:6px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:12px;min-height:46px;color:var(--text-2);font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--surface-3);font-size:1.15rem;font-weight:600;color:var(--text-2)}
.stepper b{min-width:34px;text-align:center;font-size:1.1rem}
.attr{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:6px 6px 6px 14px}
.attr b:first-child{color:var(--text-2);font-weight:600;font-size:.9rem}
.custo-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 0 8px}
.custo-num{font-size:2.6rem;min-width:72px;text-align:center}
.custo-box .stepper button{width:56px;height:56px;font-size:1.5rem;border-radius:14px}

/* efeitos */
.efeito.perigo{background:var(--danger-bg)}
.efeito.ultimo{box-shadow:inset 0 0 0 1px var(--warn)}
.efeito-nome{font-weight:600}
.tag{font-size:.7rem;color:var(--text-3)}

/* barra de ação e abas */
.barra-acao{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + env(safe-area-inset-bottom));z-index:15;background:var(--bg);padding:10px 20px;display:flex;gap:10px;max-width:520px;margin:0 auto}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:16;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);max-width:520px;margin:0 auto}
.abas button{height:var(--tabs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:500;color:var(--text-3);position:relative}
.abas button .ic{font-size:1.15rem}
.abas button.on{color:var(--text)}
.abas button.on .ic{color:var(--accent)}
.badge{position:absolute;top:10px;right:calc(50% - 20px);background:var(--surface-3);color:var(--text);border-radius:999px;font-size:.62rem;padding:1px 6px}

/* folha inferior */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--bg);width:100%;max-width:520px;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.folha.anim{animation:sobe .25s var(--ease)}
@keyframes sobe{from{transform:translateY(60px)}}
.folha-cab{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.folha-cab h2{flex:1;font-size:1.05rem;font-weight:600;margin:0}
.folha-corpo{overflow-y:auto;padding:8px 20px 28px;-webkit-overflow-scrolling:touch}
.folha-pe{padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;background:var(--bg);border-top:1px solid var(--border)}

/* decomposição */
.termo{display:flex;gap:14px;padding:7px 0;align-items:baseline}
.termo .v{min-width:52px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.termo .r{flex:1}
.termo .o{font-size:.7rem;color:var(--text-3);margin-left:4px}
.termo.filho{padding:2px 0 2px 24px;font-size:.86rem;color:var(--text-3)}
.termo.filho .v{font-weight:500}
.termo.inativo{color:var(--text-3)}
.termo.inativo .v,.termo.inativo .r>span:first-child{text-decoration:line-through}
.termo.neg .v{color:var(--danger)}
.total-linha{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-weight:600;font-size:.85rem;color:var(--text-2)}
.total-linha .grande{font-size:1.9rem;color:var(--text);font-weight:800}
.total-linha .grande.critc{color:var(--crit)}
.caixa-info{background:var(--surface);padding:12px 14px;border-radius:12px;font-size:.84rem;color:var(--text-2);margin:16px 0}
.res-rolagem{margin:12px 0;padding:14px 16px;border-radius:12px;background:var(--surface);line-height:1.6}
.res-rolagem .nat{font-size:2rem;font-weight:800}
.ameaca .nat{color:var(--crit)}
.abas-dano{display:flex;gap:6px;margin:8px 0 6px;background:var(--surface);padding:4px;border-radius:12px}
.abas-dano button{flex:1;min-height:40px;border-radius:9px;font-weight:600;color:var(--text-3)}
.abas-dano button.on{background:var(--surface-3);color:var(--text)}
.abas-dano button.crit.on{color:var(--crit)}
.dado{display:inline-block;min-width:30px;padding:2px 7px;margin:2px;border-radius:8px;background:var(--surface-3);text-align:center;font-weight:700}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + 16px + env(safe-area-inset-bottom));z-index:60;background:var(--surface-3);color:var(--text);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(calc(100vw - 40px),420px);box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:.88rem}
.toast[hidden]{display:none}
.toast button{color:var(--accent);font-weight:700;min-height:40px;padding:0 8px}
.vazio{text-align:center;color:var(--text-2);padding:32px 8px}
textarea.input{min-height:120px;font-family:ui-monospace,monospace;font-size:.8rem}
.custo-box .stepper b.custo-num{font-size:2.6rem;min-width:80px}
@media (max-height:740px){
  main.vida{gap:8px;min-height:0}
  .rcard{padding:10px 14px 12px}
  .rc-num{font-size:2.2rem}
  .rc-max{margin-bottom:6px}
  .visor-linha{min-height:40px}
  .visor{font-size:2.1rem}
  .teclado{gap:8px}
  .tecla,.acao{min-height:40px}
  .vida-rodape button{min-height:28px}
}
main.vida{flex:none}
.teclado{grid-auto-rows:minmax(40px,88px);align-content:end}
.teclado .visor-linha{grid-column:1/-1;align-self:end}

/* ── cabeçalho de combate (todas as abas) ── */
.topo-fixo{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 20px 10px}
.cab{display:flex;flex-direction:column;gap:6px}
.cab.caido{background:var(--danger-bg);margin:-8px -20px -10px;padding:8px 20px 10px}
.cab-linha{display:flex;align-items:center;gap:8px;min-height:44px}
.cab-pers{display:flex;align-items:center;gap:6px;min-height:44px;flex:1;min-width:0;text-align:left;color:var(--text-2)}
.cab-voltar{font-size:1.6rem;line-height:1;color:var(--text-3);margin-top:-3px}
.cab-nome{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turno{display:flex;align-items:center;background:var(--surface);border-radius:12px;overflow:hidden}
.turno-rod{min-height:40px;padding:0 10px 0 14px;font-size:.85rem;color:var(--text-2)}
.turno-rod b{color:var(--text);font-size:1rem;margin-left:2px}
.turno-mais{min-height:40px;width:44px;font-size:1.15rem;color:var(--accent);border-left:1px solid var(--border)}
.turno-mais:active,.turno-rod:active{background:var(--surface-3)}
.mini-chips{display:flex;gap:6px;overflow:hidden;white-space:nowrap;text-align:left;min-height:24px}
.mini-chip.buff{color:var(--ok)}
main.vida .cab{margin-bottom:-2px}

/* ── Início ── */
main.inicio{padding:calc(20px + env(safe-area-inset-top)) 20px 40px}
.inicio-cab{display:flex;align-items:flex-start;justify-content:space-between;margin:12px 0 24px}
.inicio-tit{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.pers-card{display:flex;align-items:stretch;background:var(--surface);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.pers-main{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;text-align:left}
.pers-main:active{background:var(--surface-2)}
.pers-nome{font-size:1.15rem;font-weight:700}
.pers-rec{display:flex;gap:14px;font-size:.92rem;font-weight:600;margin-top:6px}
.pers-edit{width:60px;color:var(--text-3);font-size:1.2rem;border-left:1px solid var(--border)}
.pers-edit:active{background:var(--surface-2)}
.ficha-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:calc(4px + env(safe-area-inset-top)) 0 8px}
.poder.ligado{box-shadow:inset 3px 0 0 var(--ok)}
.cab.est-caido{background:var(--danger-bg);margin:-8px -20px -10px;padding:8px 20px 10px}
.cab.est-critico .hud-rot{color:var(--danger)}
.toast.alto{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
.teclado.canhoto{grid-template-columns:1.15fr 1fr 1fr 1fr}

/* ── cabeçalho fixo com cor própria ── */
:root{--hdr:#171C24;--hdr-borda:#262D38}
html.oled{--hdr:#0F1318;--hdr-borda:#1E242D}
.topo-fixo{background:var(--hdr);border-bottom:1px solid var(--hdr-borda);margin-bottom:4px}
.topo-band{background:var(--hdr);border-bottom:1px solid var(--hdr-borda);margin:calc(-8px - env(safe-area-inset-top)) -20px 0;padding:calc(8px + env(safe-area-inset-top)) 20px 10px}
.topo-fixo .turno,.topo-band .turno{background:#222937}
.topo-fixo .mini-chip,.topo-band .mini-chip{background:#222937}
.cab.est-caido{background:transparent;margin:0;padding:0}
.topo-fixo:has(.est-caido){background:var(--danger-bg)}
.hud-linha .barra{background:#262E3A}

/* ── card de arma: acerto × dano ── */
.arma-topo{margin-bottom:12px}
.blocos{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
.bloco{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface-2);border-top:3px solid}
.bloco small{font-size:.72rem;color:var(--text-3);font-weight:600;letter-spacing:.02em}
.bloco b{font-size:1.3rem;font-weight:700;line-height:1.25}
.bloco .xs{color:var(--text-3)}
.bloco.acerto{border-color:var(--accent)}

  // ───────────────────────── PV / PM ──────────────────────────────

  /** p.236: morre com PV ≤ –10 ou ≤ –metade dos PV totais, o que for mais baixo. */
  function limiarMorte(max) { return Math.min(-10, -Math.floor(max / 2)); }

  /**
   * Consome `valor` de um recurso, temporários primeiro (p.106: "Pontos temporários são
   * sempre os primeiros a serem gastos"). Pools consumidos do mais antigo ao mais novo.
   * @returns {{recurso: Recurso, detalhe: DetalheDano}}
   */
  function aplicarDano(recurso, valor) {
    var r = normalizarRecurso(recurso);
    var v = Math.max(0, Math.floor(num(valor)));
    var resto = v, porPool = [], pools = [];
    for (var i = 0; i < r.tempPools.length; i++) {
      var p = r.tempPools[i], c = Math.min(p.valor, resto);
      resto -= c;
      if (c > 0) porPool.push({ fonte: p.fonte, consumido: c });
      if (p.valor - c > 0) pools.push({ fonte: p.fonte, valor: p.valor - c, expira: p.expira });
    }
    var novo = { max: r.max, atual: r.atual - resto, temp: sumPools(pools), tempPools: pools };
    if (pools.length) novo.tempFonte = pools[pools.length - 1].fonte;
    var estado = novo.atual <= limiarMorte(r.max) ? "morto" : novo.atual <= 0 ? "inconsciente" : "ok";
    return {
      recurso: novo,
      detalhe: { recebido: v, absorvidoTemp: v - resto, aplicadoAtual: resto, porPool: porPool, estado: estado }
    };
  }

  /** p.106: cura nunca ultrapassa o máximo; não mexe em temporários. */
  function curar(recurso, valor) {
    var r = normalizarRecurso(recurso);
    var v = Math.max(0, Math.floor(num(valor)));
    var alvo = r.atual >= r.max ? r.atual : Math.min(r.max, r.atual + v);
    var novo = clone(r); novo.atual = alvo;
    return { recurso: novo, curado: alvo - r.atual };
  }

  /**
   * Temporários (p.106): somam aos atuais mesmo acima do máximo, são gastos primeiro e somem no
   * fim do dia salvo indicação. O livro NÃO tem regra específica de "mesma fonte" para temporários;
   * aplicamos a regra geral de "Acumulando Efeitos" (p.226): ganho da MESMA fonte não acumula
   * (fica o maior); fontes diferentes somam. Habilidades que acumulam consigo mesmas dizem
   * "PM temporários cumulativos" (ex.: p.45, 54, 61, 76) ⇒ opts.cumulativo (+ opts.maxPorFonte
   * para o teto "máximo por cena igual ao seu nível"). [Interpretação — ver regras.md §1.1/§11]
   * @param {string} fonte  nome/id da fonte (ex.: "Escudo da Fé")
   * @param {{cumulativo?: boolean, expira?: "cena"|"dia"|"indefinida", maxPorFonte?: number}} opts
   */
  function adicionarTemp(recurso, valor, fonte, opts) {
    opts = opts || {};
    var r = normalizarRecurso(recurso);
    var v = Math.max(0, Math.floor(num(valor)));
    fonte = String(fonte || "temporário");
    var pools = r.tempPools.map(function (p) { return { fonte: p.fonte, valor: p.valor, expira: p.expira }; });
    var existente = null;
    for (var i = 0; i < pools.length; i++) if (pools[i].fonte === fonte) existente = pools[i];
    var regra;
    if (!existente) { pools.push({ fonte: fonte, valor: v, expira: opts.expira || "dia" }); regra = "nova fonte: acumula"; }
    else if (opts.cumulativo) { existente.valor += v; regra = "cumulativo"; }
    else if (v > existente.valor) { existente.valor = v; regra = "mesma fonte: substitui pelo maior"; }
    else regra = "mesma fonte: mantém o maior (" + existente.valor + ")";
    if (existente && opts.maxPorFonte != null) existente.valor = Math.min(existente.valor, num(opts.maxPorFonte));
    pools = pools.filter(function (p) { return p.valor > 0; });
    var novo = { max: r.max, atual: r.atual, temp: sumPools(pools), tempPools: pools };
    if (pools.length) novo.tempFonte = fonte;
    return { recurso: novo, ganho: novo.temp - r.temp, regra: regra };
  }

  /** Remove pools que expiram no fim da cena ("cena") ou do dia ("dia" remove cena+dia). */
  function expirarTemp(recurso, quando) {
    var r = normalizarRecurso(recurso);
    var pools = r.tempPools.filter(function (p) {
      if (p.expira === "indefinida") return true;
      if (quando === "dia") return false;
      return p.expira !== "cena";
    });
    var novo = { max: r.max, atual: r.atual, temp: sumPools(pools), tempPools: pools };
    if (pools.length) novo.tempFonte = pools[pools.length - 1].fonte;
    return novo;
  }

  /**
   * p.224: em habilidades de custo variável, o máximo de PM por uso = nível (na classe,
   * ou de personagem para raça/origem/poderes gerais), mas sempre se pode usar o custo mínimo.
   * Temporários são gastos primeiro (p.106).
   * @param {{custoMinimo?: number}} opts
   */
  function gastarPM(recurso, custo, limite, opts) {
    opts = opts || {};
    var r = normalizarRecurso(recurso);
    var c = Math.max(0, Math.floor(num(custo)));
    var min = opts.custoMinimo != null ? num(opts.custoMinimo) : null;
    if (limite != null && c > num(limite) && !(min != null && c <= min)) {
      return { ok: false, recurso: r, erro: "limite", mensagem: "Custo " + c + " PM excede o limite de " + num(limite) + " PM por ativação (p.224)." };
    }
    if (c > r.atual + r.temp) {
      return { ok: false, recurso: r, erro: "insuficiente", mensagem: "PM insuficientes: precisa " + c + ", tem " + (r.atual + r.temp) + "." };
    }
    var res = aplicarDano(r, c);
    return { ok: true, recurso: res.recurso, gastoTemp: res.detalhe.absorvidoTemp, gastoAtual: res.detalhe.aplicadoAtual };
  }

  // ───────────────────────── catálogo e efeitos ───────────────────

  /** Aceita {id: item} ou {melhorias:[...], encantos:[...], ...} ou array. Devolve mapa id → item. */
  function indexarCatalogo(catalogo) {
    var idx = {};
    function add(it) { if (it && typeof it === "object" && it.id) idx[it.id] = it; }
    function walk(v, depth) {
      if (!v || depth > 3) return;
      if (Array.isArray(v)) { v.forEach(function (x) { if (x && x.id) add(x); else walk(x, depth + 1); }); return; }
      if (typeof v === "object") {
        if (v.id && Array.isArray(v.efeitos)) { add(v); return; }
        Object.keys(v).forEach(function (k) {
          var x = v[k];
          if (x && typeof x === "object" && !Array.isArray(x) && !x.id && Array.isArray(x.efeitos)) add(Object.assign({ id: k }, x));
          else walk(x, depth + 1);
        });
      }
    }
    if (!catalogo || typeof catalogo !== "object") return {};
    if (catalogo.__indexado) return catalogo;
    if (CACHE_IDX && CACHE_IDX.has(catalogo)) return CACHE_IDX.get(catalogo);
    walk(catalogo, 0);
    Object.defineProperty(idx, "__indexado", { value: true, enumerable: false });
    if (CACHE_IDX) CACHE_IDX.set(catalogo, idx); // catálogo é imutável em runtime ⇒ indexa 1x
    return idx;
  }
  var CACHE_IDX = typeof WeakMap === "function" ? new WeakMap() : null;

  function anotar(efeitos, origem) {
    return (Array.isArray(efeitos) ? efeitos : []).filter(function (e) { return e && e.alvo && e.op; })
      .map(function (e) { var o = clone(e); o.origem = origem; return o; });
  }

  /**
   * Junta todos os Effect relevantes para um ataque com `arma`:
   * melhorias, material, encantos (catálogo), passivos do personagem e efeitos ativos
   * (condições/buffs; os com `armaId` só valem para aquela arma).
   * @returns {{efeitos: EffectOrigem[], avisos: string[]}}
   */
  function coletarEfeitos(arma, personagem, efeitosAtivos, catalogo) {
    var idx = indexarCatalogo(catalogo || {});
    var out = [], avisos = [];
    function doCatalogo(id, tipo) {
      var it = idx[id];
      if (!it) { avisos.push("Item de catálogo desconhecido: " + id + " (ignorado)."); return; }
      out = out.concat(anotar(it.efeitos, { tipo: tipo, id: id, nome: it.nome || id }));
    }
    if (arma) {
      (arma.melhorias || []).forEach(function (id) { doCatalogo(id, "melhoria"); });
      if (arma.material) doCatalogo(arma.material, "material");
      (arma.encantos || []).forEach(function (id) { doCatalogo(id, "encanto"); });
    }
    if (arma) {
      // catálogo: "incompativel" (ex.: Maciça × Precisa) — só avisa, não bloqueia
      var comps = [].concat(arma.melhorias || [], arma.material ? [arma.material] : [], arma.encantos || []);
      comps.forEach(function (id) {
        ((idx[id] && idx[id].incompativel) || []).forEach(function (outro) {
          if (comps.indexOf(outro) >= 0 && id < outro) avisos.push((idx[id].nome || id) + " é incompatível com " + ((idx[outro] || {}).nome || outro) + ".");
        });
      });
    }
    var ativos = [].concat((personagem && personagem.passivos) || [], efeitosAtivos || []);
    var vistos = {};
    function addAtivo(ea, implicadoPor) {
      if (!ea) return;
      if (ea.armaId && (!arma || ea.armaId !== arma.id)) return;
      var cid = ea.catalogoId;
      if (cid) { if (vistos[cid]) return; vistos[cid] = true; }
      var efs = ea.efeitos;
      if ((!efs || !efs.length) && cid && idx[cid]) efs = idx[cid].efeitos;
      var nome = ea.nome || (cid && idx[cid] && idx[cid].nome) || cid || "efeito";
      out = out.concat(anotar(efs, { tipo: ea.fonteTipo || "habilidade", id: cid || ea.uid || ea.nome, nome: implicadoPor ? nome + " (por " + implicadoPor + ")" : nome }));
      if (cid && idx[cid] && Array.isArray(idx[cid].implica)) pendentes.push({ ids: idx[cid].implica, por: nome, tipo: ea.fonteTipo || "condicao" });
    }
    // 1º as explícitas (têm precedência), depois expande "implica" (agarrado ⇒ desprevenido, imóvel), recursivo
    var pendentes = [];
    ativos.forEach(function (ea) { addAtivo(ea, null); });
    while (pendentes.length) {
      var pd = pendentes.shift();
      pd.ids.forEach(function (iid) { if (idx[iid]) addAtivo({ catalogoId: iid, fonteTipo: pd.tipo }, pd.por); });
    }
    return { efeitos: out, avisos: avisos };
  }

  /**
   * Chave de acúmulo (p.226 "Acumulando Efeitos"; p.333 itens; p.334 encantos):
   *  - tipoBonus explícito ⇒ mesmo alvo + mesmo tipoBonus não acumula (contrato comum).
   *  - habilidade/perícia/condição/poder: acumulam entre si, exceto da MESMA habilidade (id).
   *  - item, magia, parceiro, ambiente: acumulam com outras categorias, mas não entre si.
   *  - encantos: "bônus por encantos não se acumulam" (p.334) ⇒ um grupo só.
   *  - melhorias: cada melhoria é distinta (acumulam com outras melhorias e com encantos).
   *  - manual/situacional: sempre acumulam (o jogador digitou de propósito).
   *  - danoExtraDados: fontes diferentes sempre somam.
   *  - efeitos com `condicional` diferente ficam em grupos separados (Dilacerante só no crítico
   *    não compete com Formidável).
   */
  function chaveAcumulo(e, i) {
    var o = e.origem || { tipo: "manual", id: "?" };
    var g;
    if (e.tipoBonus) g = "tipo:" + e.tipoBonus;
    else switch (o.tipo) {
      case "item": case "magia": case "parceiro": case "ambiente": case "encanto": case "material": g = o.tipo; break;
      case "manual": case "situacional": g = o.tipo + "#" + i; break;
      default: g = o.tipo + ":" + o.id;
    }
    // Dados extras de fontes diferentes (Flamejante 1d6 fogo + Congelante 1d6 frio) somam: são dados
    // de dano distintos, não "bônus" numéricos (decisão; p.334 fala de bônus). Mesma fonte não duplica.
    if (e.alvo === "danoExtraDados") g += "@" + o.id;
    return e.alvo + "|" + g + (e.condicional ? "|c:" + e.condicional : "");
  }

  function mediaDados(str) {
    var m = String(str).match(/(\d*)d(\d+)/i);
    if (!m) return num(String(str).match(/-?\d+/));
    return (num(m[1], 1) || 1) * (num(m[2]) + 1) / 2;
  }

  /**
   * Aplica a regra de acúmulo. Para cada grupo: positivos ⇒ fica o maior; negativos ⇒ fica o
   * pior (penalidades iguais também não acumulam). "define" não acumula: vence o último na
   * ordem de prioridade (manual > situacional > condição > magia > habilidade > item/arma).
   * @returns {{efeitos: EffectOrigem[] (só os válidos), descartados: EffectOrigem[], todos: EffectOrigem[]}}
   */
  function resolverAcumulo(efeitos, opts) {
    opts = opts || {};
    var lista = (efeitos || []).map(function (e) { return Object.assign({}, e, { descartado: !!e.descartado }); });
    // Opção (regras.md §21): melhoria "maior" substitui a pré-requisito em vez de somar
    // (Pungente substitui Certeira; Atroz substitui Cruel). Padrão do livro (p.334): somar.
    var sub = opts.substituicoes || {}; // { idSubstituido: idSubstituto }
    var ids = {};
    lista.forEach(function (e) { if (e.origem) ids[e.origem.id] = e.origem.nome; });
    lista.forEach(function (e) {
      var por = e.origem && sub[e.origem.id];
      if (por && ids[por]) { e.descartado = true; e.motivo = "substituída por " + ids[por] + " (opção de mesa)"; }
    });
    var grupos = {};
    lista.forEach(function (e, i) {
      if (e.descartado || e.op === "define" || e.alvo === "flag") return; // "define" tratado abaixo
      if (e.alvo === "margemAmeaca" && typeof e.valor === "string") return; // "x2" (Ameaçadora)
      var k = chaveAcumulo(e, i);
      (grupos[k] = grupos[k] || []).push(e);
    });
    Object.keys(grupos).forEach(function (k) {
      var g = grupos[k];
      if (g.length < 2) return;
      var isStr = g.some(function (e) { return typeof e.valor === "string"; });
      var val = function (e) { return isStr ? mediaDados(e.valor) : num(e.valor); };
      var pos = g.filter(function (e) { return val(e) >= 0; }), neg = g.filter(function (e) { return val(e) < 0; });
      [pos, neg].forEach(function (sub, si) {
        if (sub.length < 2) return;
        var melhor = sub.reduce(function (a, b) { return si === 0 ? (val(b) > val(a) ? b : a) : (val(b) < val(a) ? b : a); });
        sub.forEach(function (e) {
          if (e !== melhor) { e.descartado = true; e.motivo = "não acumula com " + melhor.origem.nome + " (mesma fonte/tipo)"; }
        });
      });
    });
    // "define": um vencedor por alvo
    var prio = { manual: 6, situacional: 5, condicao: 4, magia: 3, habilidade: 2 };
    var defs = {};
    lista.forEach(function (e) {
      if (e.descartado || e.op !== "define" || e.alvo === "flag") return;
      if (e.alvo === "margemAmeaca" && /^(x2|dobro|duplica)$/i.test(String(e.valor))) return;
      var atual = defs[e.alvo];
      var p = prio[(e.origem || {}).tipo] || 1;
      if (!atual || p >= atual.p) {
        if (atual) { atual.e.descartado = true; atual.e.motivo = "sobrescrito por " + e.origem.nome; }
        defs[e.alvo] = { e: e, p: p };
      } else { e.descartado = true; e.motivo = "sobrescrito por " + atual.e.origem.nome; }
    });
    return {
      efeitos: lista.filter(function (e) { return !e.descartado; }),
      descartados: lista.filter(function (e) { return e.descartado; }),
      todos: lista
    };
  }

  // ───────────────────────── passos de dano (Tabela 3-2, p.143) ───

  // Cada linha da tabela: [–2, –1, Normal, +1, +2, +3]. Um passo = mover uma coluna NA LINHA
  // do valor atual. Iterar passos simples reproduz exatamente todas as células da tabela.
  var LINHAS = [
    ["1", "1d2", "1d3", "1d4", "1d6", "1d8"],
    ["1d2", "1d3", "1d4", "1d6", "1d8", "1d10"],
    ["1d3", "1d4", "1d6", "1d8", "1d10", "1d12"],
    ["1d4", "1d6", "1d8", "1d10", "1d12", "3d6"],
    ["1d6", "1d8", "1d10", "1d12", "3d6", "4d6"],
    ["1d8", "1d10", "1d12", "3d6", "4d6", "4d8"],
    ["1d10", "2d6", "2d8", "3d8", "4d8", "4d10"],
    ["2d6", "2d8", "2d10", "3d10", "4d10", "4d12"]
  ];
  var ALIAS = { "2d4": "1d8", "3d4": "1d12", "2d6": "1d12" }; // "1d8 ou 2d4", "1d12, 2d6 ou 3d4"
  var PASSOS_PADRAO = montarPassos(LINHAS, ALIAS);
  var CACHE_PASSOS = typeof WeakMap === "function" ? new WeakMap() : null;

  /** Constrói os mapas a partir de uma tabela {linhas, equivalencias} (ex.: catalogo.tabelaPassosDano). */
  function montarPassos(linhas, alias) {
    var SOBE = {}, DESCE = {}, PORNORMAL = {};
    // 1º: passos a partir da coluna Normal (linha própria do valor) têm prioridade
    linhas.forEach(function (l) { PORNORMAL[l[2]] = l; SOBE[l[2]] = l[3]; DESCE[l[2]] = l[1]; });
    // 2º: valores que não são "Normal" de nenhuma linha (1, 1d2, 3d6, 4d6, 3d8, 4d8, ...)
    linhas.forEach(function (l) {
      for (var i = 0; i < l.length; i++) {
        if (i < l.length - 1 && !(l[i] in SOBE) && !(l[i] in alias)) SOBE[l[i]] = l[i + 1];
        if (i > 0 && !(l[i] in DESCE) && !(l[i] in alias)) DESCE[l[i]] = l[i - 1];
      }
    });
    // Ambiguidade: 4d8↓ pode ser 4d6 (linha 1d12) ou 3d8 (linha 2d8); 4d10↓ pode ser 4d8 ou 3d10.
    // Escolha: vizinho de média mais próxima (4d6, 4d8) — decisão documentada. Só ocorre ao
    // DIMINUIR um dano que já foi aumentado além da linha da tabela (raro).
    if (DESCE["4d8"]) DESCE["4d8"] = "4d6";
    if (DESCE["4d10"]) DESCE["4d10"] = "4d8";
    if (alias["2d6"]) DESCE["2d6"] = "1d10"; // linha "1d12, 2d6 ou 3d4" e linha 2d8 concordam
    return { SOBE: SOBE, DESCE: DESCE, PORNORMAL: PORNORMAL, ALIAS: alias };
  }
  function passosDe(tabela) {
    if (!tabela || !Array.isArray(tabela.linhas)) return PASSOS_PADRAO;
    if (CACHE_PASSOS && CACHE_PASSOS.has(tabela)) return CACHE_PASSOS.get(tabela);
    var m = montarPassos(tabela.linhas, tabela.equivalencias || ALIAS);
    if (CACHE_PASSOS) CACHE_PASSOS.set(tabela, m);
    return m;
  }

  /**
   * Aumenta/diminui `dados` em `n` passos (n negativo diminui). Teto 4d12 ("máximo"), piso "1".
   * Se `dados` é um valor Normal (ou equivalente: 2d4, 2d6, 3d4) e –2 ≤ n ≤ +3, lê a célula
   * da Tabela 3-2 diretamente; fora disso, encadeia passos simples (cada um na linha do valor atual).
   * @param tabela opcional {linhas, equivalencias} — use catalogo.tabelaPassosDano
   * @returns {{dados: string, aplicados: number, avisos: string[]}}
   */
  function passoDano(dados, n, tabela) {
    var T = passosDe(tabela);
    var d = String(dados).trim().toLowerCase().replace(/\s+/g, "");
    var avisos = [], aplicados = 0;
    n = Math.trunc(num(n));
    if (/^\d+$/.test(d) && d !== "1") return { dados: d, aplicados: 0, avisos: ["Dano fixo '" + d + "' não tem passos."] };
    var linha = T.PORNORMAL[d] || T.PORNORMAL[T.ALIAS[d]];
    if (linha && n >= -2 && n <= 3) return { dados: linha[2 + n], aplicados: n, avisos: [] };
    for (var i = 0; i < Math.abs(n); i++) {
      var mapa = n > 0 ? T.SOBE : T.DESCE;
      var k = d in mapa ? d : (T.ALIAS[d] || d);
      var prox = mapa[k];
      if (prox === undefined) {
        if (!(k in T.SOBE) && !(k in T.DESCE)) avisos.push("Dado '" + dados + "' fora da Tabela 3-2; passos ignorados.");
        else avisos.push(n > 0 ? "Dano já está no máximo da tabela (" + d + ")." : "Dano já está no mínimo (1).");
        break;
      }
      d = prox; aplicados++;
    }
    return { dados: d, aplicados: n < 0 ? -aplicados : aplicados, avisos: avisos };
  }

  /** Multiplica a quantidade de dados ("2d6" x3 → "6d6"; "1" x2 → "2"). p.231 */
  function multiplicarDados(dados, mult) {
    var m = String(dados).match(/^(\d*)d(\d+)$/i);
    if (!m) return String(num(dados) * mult);
    return ((num(m[1], 1) || 1) * mult) + "d" + m[2];
  }

  // ───────────────────────── perícia / ataque ─────────────────────

  /** p.114: +2 (1º–6º), +4 (7º–14º), +6 (15º+). */
  function bonusTreino(nivel) { return nivel >= 15 ? 6 : nivel >= 7 ? 4 : 2; }

  function totalEfeito(efs, alvo) {
    return efs.filter(function (e) { return e.alvo === alvo && e.op === "soma" && typeof e.valor !== "string"; })
      .reduce(function (s, e) { return s + num(e.valor); }, 0);
  }

  /** Categoria de origem no vocabulário do componente LinhaTermo (ux.md). */
  function categoriaUX(o) {
    switch (o && o.tipo) {
      case "melhoria": case "material": case "encanto": case "condicao": return o.tipo;
      case "situacional": return "situacao";
      case "manual": return "avulso";
      default: return "buff"; // habilidade, magia, item, parceiro, ambiente
    }
  }
  function termo(rotulo, valor, origem, extra) {
    var t = { rotulo: rotulo, valor: valor, origem: origem, ativo: true };
    if (extra) for (var k in extra) if (extra[k] !== undefined) t[k] = extra[k];
    return t;
  }
  function termoEfeito(e, rotulo, valor) {
    return termo(rotulo || e.origem.nome, valor === undefined ? e.valor : valor, categoriaUX(e.origem), {
      fonteId: e.origem.id, ativo: !e.descartado, motivoInativo: e.descartado ? e.motivo : undefined, nota: e.nota
    });
  }
  function faixaTxt(m) { return m >= 20 ? "20" : m + "–20"; }

  /** Média/mín/máx de uma fórmula ("2d8+4 + 1d6 fogo"). */
  function estatisticaFormula(formula) {
    var r = { media: 0, min: 0, max: 0 };
    String(formula).toLowerCase().replace(/([+-]?)\s*(\d*)d(\d+)|([+-]?)\s*(\d+)(?!\s*d)/g, function (m0, s1, q, f, s2, k) {
      if (f) { var n = (num(q, 1) || 1) * (s1 === "-" ? -1 : 1); r.media += n * (num(f) + 1) / 2; r.min += n; r.max += n * num(f); }
      else if (k) { var v = num(k) * (s2 === "-" ? -1 : 1); r.media += v; r.min += v; r.max += v; }
      return m0;
    });
    return r;
  }

  var CONDICIONAIS_AUTO = { apenasAcerto: 1 }; // dano só acontece no acerto ⇒ sempre válido no cálculo

  /**
   * Calcula o ataque completo com explicação de cada número (ux.md §3.3).
   * @param situacionais Effect[] escolhidos na hora (Flanqueando, Ataque Poderoso, modificador avulso).
   *        Aceita {rotulo, origem?}. Sem origem ⇒ tipo "situacional".
   * @param opts {
   *   ativados?: string[]      ids de catálogo cujos efeitos `condicional` ("ativado", "situacional",
   *                            "manobra", "contraCorpoACorpo"...) devem valer neste ataque; também aceita
   *                            o próprio nome do condicional (ex.: "manobra").
   *   substituirMelhorias?: boolean  Pungente substitui Certeira, Atroz substitui Cruel (padrão: somam).
   *   lancinante?: "mais10" | "multiplicaBonus"  escolha no crítico (default "mais10").
   *   base?: 0 | 1 | 2         "Comparar": 1 = sem melhorias/material/encantos; 2 = também sem situação/condições/buffs.
   * }
   */
  function calcularAtaque(personagem, arma, efeitosAtivos, catalogo, situacionais, opts) {
    opts = opts || {};
    var p = personagem || {}, a = arma || {};
    var attrs = p.atributos || {};
    var nivel = Math.max(1, num(p.nivel, 1));
    var avisos = [];
    var tipo = a.tipo || "corpoACorpo";

    var armaCol = opts.base >= 1 ? Object.assign({}, a, { melhorias: [], material: undefined, encantos: [] }) : a;
    var col = coletarEfeitos(armaCol, opts.base >= 2 ? { passivos: p.passivos } : p, opts.base >= 2 ? [] : efeitosAtivos, catalogo);
    avisos = avisos.concat(col.avisos);
    var sit = opts.base >= 2 ? [] : (situacionais || []).map(function (e, i) {
      var o = clone(e); o.origem = o.origem || { tipo: "situacional", id: "sit" + i, nome: e.rotulo || e.nota || "Situacional" }; return o;
    });

    // ── separa efeitos condicionais (extensão do catálogo: campo `condicional`) ──
    var ativ = opts.ativados || [];
    var normais = [], soCritico = [], opcionais = [];
    col.efeitos.concat(sit).forEach(function (e) {
      var c = e.condicional;
      if (!c || CONDICIONAIS_AUTO[c]) return normais.push(e);
      if (c === "corpoACorpo") return tipo === "corpoACorpo" ? normais.push(e) : null;
      if (c === "apenasCritico") return soCritico.push(e);
      if (ativ.indexOf(e.origem.id) >= 0 || ativ.indexOf(c) >= 0) return normais.push(e);
      opcionais.push({ fonteId: e.origem.id, nome: e.origem.nome, condicional: c, alvo: e.alvo, valor: e.valor, nota: e.nota });
    });
    var res = resolverAcumulo(normais, { substituicoes: opts.substituirMelhorias ? { certeira: "pungente", cruel: "atroz" } : null });
    var ok = res.efeitos;
    var defineDe = function (alvo) { var d = ok.filter(function (e) { return e.alvo === alvo && e.op === "define"; }); return d.length ? d[d.length - 1] : null; };
    var flags = ok.filter(function (e) { return e.alvo === "flag"; }).map(function (e) { return String(e.valor); });
    var temFlag = function (f) { return flags.indexOf(f) >= 0; };

    // ── perícia e atributo de ataque (p.114, p.124) ──
    var periciaNome = tipo === "corpoACorpo" ? "luta" : "pontaria";
    var per = ((p.pericias || {})[periciaNome]) || { treinado: false, outros: 0 };
    var attrAtq = per.atributo || (periciaNome === "luta" ? "FOR" : "DES");
    var attrAtqMotivo = "";
    // Acuidade com Arma (p.124): arma corpo a corpo leve (ou ágil, p.143) ou de arremesso ⇒ pode usar
    // DES em ataque E dano. "Pode" ⇒ o engine escolhe a melhor opção automaticamente.
    var acuidadeElegivel = !!p.acuidade && ((tipo === "corpoACorpo" && (a.categoria === "leve" || a.acuidade)) || tipo === "arremesso");
    var usaAcuidade = acuidadeElegivel && num(attrs.DES) > num(attrs.FOR);
    if (usaAcuidade && tipo === "corpoACorpo") { attrAtq = "DES"; attrAtqMotivo = "Acuidade com Arma"; }
    var dAtq = defineDe("atributoAtaque");
    if (dAtq && ATRIBUTOS.indexOf(dAtq.valor) >= 0) { attrAtq = dAtq.valor; attrAtqMotivo = dAtq.origem.nome; }
    if (a.atributoAtaque && ATRIBUTOS.indexOf(a.atributoAtaque) >= 0) { attrAtq = a.atributoAtaque; attrAtqMotivo = "definido na arma"; }

    var filhos = [termo("½ nível (" + nivel + ")", Math.floor(nivel / 2), "nivel"),
                  termo(attrAtq + (attrAtqMotivo ? " (" + attrAtqMotivo + ")" : ""), num(attrs[attrAtq]), "atributo")];
    if (per.treinado) filhos.push(termo("treinado", bonusTreino(nivel), "treino"));
    if (num(per.outros)) filhos.push(termo("outros bônus da perícia", num(per.outros), "avulso"));
    var totPer = filhos.reduce(function (s, x) { return s + x.valor; }, 0);
    var partes = [termo(periciaNome === "luta" ? "Luta" : "Pontaria", totPer, "base", { filhos: filhos })];
    if (a.proficiente === false) partes.push(termo("Não proficiente (p.142)", -5, "base"));
    if (num(a.bonusAtaque)) partes.push(termo("Bônus manual da arma", num(a.bonusAtaque), "avulso"));
    res.todos.forEach(function (e) { if (e.alvo === "ataque" && e.op === "soma") partes.push(termoEfeito(e, null, num(e.valor))); });
    var bonusTotal = partes.reduce(function (s, x) { return s + (x.ativo ? num(x.valor) : 0); }, 0);

    // ── margem de ameaça (p.142, p.231; Ameaçadora p.335: duplicar ANTES de somar) ──
    var margemBase = num(a.margem, 20) || 20;
    var faixa = 21 - margemBase;
    var margemPartes = [termo("Base da arma", faixaTxt(margemBase), "base")];
    var dobros = ok.filter(function (e) {
      return (e.alvo === "flag" && e.valor === "duplicaMargem") || (e.alvo === "margemAmeaca" && /^(x2|dobro|duplica)$/i.test(String(e.valor)));
    });
    if (dobros.length) {
      faixa = faixa * (1 + dobros.length); // p.225 "Multiplicações": x2 + x2 = x3
      dobros.forEach(function (e) { margemPartes.push(termoEfeito(e, e.origem.nome + " (duplica)", "×2")); });
    }
    var dMarg = ok.filter(function (e) { return e.alvo === "margemAmeaca" && e.op === "define" && typeof e.valor === "number"; });
    if (dMarg.length) { faixa = 21 - num(dMarg[dMarg.length - 1].valor); margemPartes.push(termoEfeito(dMarg[dMarg.length - 1], null, faixaTxt(num(dMarg[dMarg.length - 1].valor)))); }
    res.todos.forEach(function (e) { if (e.alvo === "margemAmeaca" && e.op === "soma" && typeof e.valor === "number") margemPartes.push(termoEfeito(e)); });
    faixa += totalEfeito(ok, "margemAmeaca");
    var margem = 21 - faixa;
    if (margem < 2) { avisos.push("Margem de ameaça limitada a 2 (1 natural sempre erra, p.221)."); margem = 2; }
    if (margem > 20) margem = 20;

    // ── multiplicador ──
    var dMult = defineDe("multCritico");
    var multiplicador = (dMult ? num(dMult.valor) : num(a.mult, 2) || 2) + totalEfeito(ok, "multCritico");
    var multPartes = [termo("Base da arma", "×" + (num(a.mult, 2) || 2), "base")];
    if (dMult) multPartes.push(termoEfeito(dMult, null, "×" + num(dMult.valor)));
    res.todos.forEach(function (e) { if (e.alvo === "multCritico" && e.op === "soma") multPartes.push(termoEfeito(e)); });

    // ── dados de dano (define → passos, Tabela 3-2) ──
    var tabela = catalogo && catalogo.tabelaPassosDano;
    var dPartes = [];
    var dadosBase = String(a.dano || "1d4").trim().toLowerCase();
    var dados = dadosBase;
    var dDados = defineDe("danoDados");
    if (dDados) dados = String(dDados.valor).toLowerCase();
    var passos = 0, rotPassos = [];
    res.todos.forEach(function (e) {
      if (e.alvo === "danoDados" && e.op === "passo") {
        if (!e.descartado) { passos += num(e.valor); rotPassos.push(sinal(num(e.valor)) + " passo: " + e.origem.nome); }
        else dPartes.push(termoEfeito(e, "Passo: " + e.origem.nome, sinal(num(e.valor))));
      }
    });
    if (passos) {
      var ps = passoDano(dados, passos, tabela);
      avisos = avisos.concat(ps.avisos);
      dados = ps.dados;
    }
    // ux.md: "1d8 → 1d10 (+1 passo: Maciça)"
    dPartes.unshift(termo((a.nome || "arma") + (dDados ? " (dados definidos por " + dDados.origem.nome + ")" : "") +
      (rotPassos.length ? " — " + (dDados ? dDados.valor : dadosBase) + " → " + dados + " (" + rotPassos.join(", ") + ")" : ""), dados, "base"));

    // ── atributo de dano (p.142 / p.230) ──
    var attrDano = null, attrDanoMotivo = "";
    if (tipo === "corpoACorpo" || tipo === "arremesso") attrDano = "FOR";
    else attrDanoMotivo = "arma de disparo não soma atributo (p.142)";
    if (usaAcuidade) { attrDano = "DES"; attrDanoMotivo = "Acuidade com Arma"; }
    var dAtrD = defineDe("atributoDano");
    if (dAtrD && ATRIBUTOS.indexOf(dAtrD.valor) >= 0) { attrDano = dAtrD.valor; attrDanoMotivo = dAtrD.origem.nome; }
    if (a.atributoDano === "nenhum") { attrDano = null; attrDanoMotivo = "definido na arma"; }
    else if (a.atributoDano && ATRIBUTOS.indexOf(a.atributoDano) >= 0) { attrDano = a.atributoDano; attrDanoMotivo = "definido na arma"; }

    var bonus = 0;
    if (attrDano) { bonus += num(attrs[attrDano]); dPartes.push(termo(attrDano + (attrDanoMotivo ? " (" + attrDanoMotivo + ")" : ""), num(attrs[attrDano]), "atributo")); }
    else dPartes.push(termo("Sem atributo: " + attrDanoMotivo, 0, "base", { ativo: false, motivoInativo: attrDanoMotivo }));
    if (num(a.bonusDano)) { bonus += num(a.bonusDano); dPartes.push(termo("Bônus manual da arma", num(a.bonusDano), "avulso")); }
    var extras = [];
    res.todos.forEach(function (e) {
      if (e.alvo === "dano" && e.op === "soma") { if (!e.descartado) bonus += num(e.valor); dPartes.push(termoEfeito(e, null, num(e.valor))); }
      if (e.alvo === "danoExtraDados") {
        if (!e.descartado) extras.push(String(e.valor));
        dPartes.push(termoEfeito(e, e.origem.nome + " (dado extra, não multiplica)", String(e.valor)));
      }
    });

    // ── somente no crítico (Dilacerante +10, Lancinante...) ──
    var bonusCrit = 0, critPartes = [];
    var lancinante = soCritico.some(function (e) { return e.alvo === "flag" && e.valor === "criticoLancinante"; });
    var resCrit = resolverAcumulo(soCritico);
    resCrit.todos.forEach(function (e) {
      if (e.alvo === "flag") { if (!e.descartado) flags.push(String(e.valor)); return; }
      if (lancinante && e.origem.id === "dilacerante") { e.descartado = true; e.motivo = "substituída por Lancinante"; }
      if (e.alvo === "dano" && e.op === "soma") { if (!e.descartado) bonusCrit += num(e.valor); critPartes.push(termoEfeito(e, e.origem.nome + " (só no crítico)", num(e.valor))); }
      if (e.alvo === "danoExtraDados") { if (!e.descartado) extras.push(String(e.valor) + "*"); critPartes.push(termoEfeito(e, e.origem.nome + " (só no crítico)", String(e.valor))); }
    });
    var extrasNormais = extras.filter(function (x) { return x.slice(-1) !== "*"; });
    var extrasCrit = extras.map(function (x) { return x.replace(/\*$/, ""); });
    var multBonus = false;
    if (lancinante) {
      if (opts.lancinante === "multiplicaBonus") { multBonus = true; critPartes.push(termo("Lancinante: bônus numéricos também multiplicam", "×" + multiplicador, "encanto")); }
      else { bonusCrit += 10; critPartes.push(termo("Lancinante (+10 no crítico)", 10, "encanto")); }
    }

    if (temFlag("apenasArmasLeves") && a.categoria !== "leve") avisos.push("Agarrado: só pode atacar com armas leves.");
    if (temFlag("naoAgir")) avisos.push("Uma condição impede de agir.");

    var fmtB = function (b) { return b ? (b > 0 ? "+" + b : String(b)) : ""; };
    var fmtE = function (l) { return l.length ? " + " + l.join(" + ") : ""; };
    var bonusCritTotal = (multBonus ? bonus * multiplicador : bonus) + bonusCrit;
    var dadosCrit = multiplicarDados(dados, multiplicador);
    var formula = dados + fmtB(bonus) + fmtE(extrasNormais);
    var formulaCritico = dadosCrit + fmtB(bonusCritTotal) + fmtE(extrasCrit);
    critPartes.unshift(termo("Dados da arma " + dados + " ×" + multiplicador + " (bônus fixos e dados extras não multiplicam, p.231)", dadosCrit, "base"));

    return {
      bonusTotal: bonusTotal,
      partes: partes,
      atributoAtaque: attrAtq,
      pericia: periciaNome,
      margem: margem,
      margemTexto: faixaTxt(margem),
      margemPartes: margemPartes,
      multiplicador: multiplicador,
      multPartes: multPartes,
      dano: {
        dados: dados, bonus: bonus, extras: extrasNormais,
        formula: formula,
        formulaCritico: formulaCritico,
        partes: dPartes,
        partesCritico: critPartes,
        estatistica: estatisticaFormula(formula),
        estatisticaCritico: estatisticaFormula(formulaCritico)
      },
      flags: flags,
      opcionais: opcionais,     // efeitos condicionais disponíveis (UI mostra como chips a ativar)
      bloqueado: temFlag("naoAgir"),
      avisos: avisos,
      efeitosDescartados: res.descartados.concat(resCrit.descartados).map(function (e) { return { alvo: e.alvo, origem: e.origem.nome, motivo: e.motivo }; })
    };
  }

  /**
   * p.221: 20 natural sempre sucesso, 1 natural sempre falha.
   * p.142/231: ameaça se d20 ≥ margem; crítico = ameaça E acerto.
   */
  function avaliarRolagem(d20, bonus, margem, defesaAlvo) {
    var n = Math.trunc(num(d20)), total = n + num(bonus);
    var auto = n >= 20 ? "sucesso" : n <= 1 ? "falha" : null;
    var ameaca = n !== 1 && n >= num(margem, 20);
    var temDef = defesaAlvo !== undefined && defesaAlvo !== null && defesaAlvo !== "";
    var acerto = auto === "sucesso" ? true : auto === "falha" ? false : temDef ? total >= num(defesaAlvo) : null;
    var critico = acerto === null ? (ameaca ? null : false) : (ameaca && acerto);
    return { natural: n, total: total, ameaca: ameaca, acerto: acerto, critico: critico, automatico: auto };
  }

  // ───────────────────────── rolagem ──────────────────────────────

  /**
   * Rola "2d6+3", "1d8+1d6 fogo - 1", "4d6". Rótulos textuais são preservados nos termos.
   * @param {() => number} rng  retorna [0,1). Default Math.random (só aqui).
   */
  function rolar(formula, rng) {
    rng = rng || Math.random;
    var s = String(formula || "").toLowerCase();
    var re = /([+-]?)\s*(\d*)d(\d+)([a-zà-ú ]*)|([+-]?)\s*(\d+)(?!\s*d)([a-zà-ú ]*)/g;
    var m, termos = [], total = 0;
    while ((m = re.exec(s))) {
      if (m[3]) {
        var q = num(m[2], 1) || 1, f = num(m[3]), sg = m[1] === "-" ? -1 : 1, rol = [];
        if (q > 200 || f > 1000 || f < 1) throw new Error("Dados fora do limite: " + m[0]);
        for (var i = 0; i < q; i++) rol.push(1 + Math.floor(rng() * f));
        var sub = sg * rol.reduce(function (x, y) { return x + y; }, 0);
        termos.push({ termo: (sg < 0 ? "-" : "") + q + "d" + f, rotulo: m[4].trim() || undefined, rolagens: rol, subtotal: sub });
        total += sub;
      } else if (m[6]) {
        var v = (m[5] === "-" ? -1 : 1) * num(m[6]);
        termos.push({ termo: String(v), rotulo: m[7].trim() || undefined, rolagens: [], subtotal: v });
        total += v;
      }
    }
    return { formula: String(formula), total: total, termos: termos };
  }

  // ───────────────────────── PM: custo e limite ───────────────────

  /** Limite de PM por ativação = (limitePMBase ?? nível) + efeitos "limitePM" (p.224). */
  function limitePM(personagem, efeitosResolvidos) {
    var base = personagem && personagem.limitePMBase != null ? num(personagem.limitePMBase) : num(personagem && personagem.nivel, 1);
    return base + totalEfeito(efeitosResolvidos || [], "limitePM");
  }

  /** p.226: reduções de custo de PM não são cumulativas (vale a maior); custo mínimo 1 PM. */
  function custoPMEfetivo(custoBase, efeitos) {
    var c = num(custoBase);
    var reds = (efeitos || []).filter(function (e) { return e.alvo === "custoPMHabilidade" && e.op === "soma" && !e.descartado; })
      .map(function (e) { return Math.abs(num(e.valor)); });
    var maior = reds.length ? Math.max.apply(null, reds) : 0;
    if (c <= 0) return { custo: 0, reducao: 0 };
    var final = Math.max(1, c - maior);
    return { custo: final, reducao: c - final };
  }

  // ───────────────────────── durações ─────────────────────────────

  /** Decrementa "rodadas"; expira os que chegam a 0. */
  function avancarRodada(efeitosAtivos) {
    var ativos = [], expirados = [];
    (efeitosAtivos || []).forEach(function (ea) {
      var d = ea.duracao || { tipo: "indefinida" };
      if (d.tipo !== "rodadas") { ativos.push(ea); return; }
      var r = num(d.restante, 1) - 1;
      var novo = Object.assign({}, ea, { duracao: { tipo: "rodadas", restante: r } });
      (r <= 0 ? expirados : ativos).push(novo);
    });
    return { efeitos: ativos, expirados: expirados };
  }

  /** Fim de cena: remove rodadas e cena. Fim de dia ("dia"): remove também "dia". */
  function encerrar(efeitosAtivos, quando) {
    var ativos = [], expirados = [];
    (efeitosAtivos || []).forEach(function (ea) {
      var t = (ea.duracao || {}).tipo || "indefinida";
      var sai = t === "rodadas" || t === "cena" || (quando === "dia" && t === "dia");
      (sai ? expirados : ativos).push(ea);
    });
    return { efeitos: ativos, expirados: expirados };
  }

  // ───────────────────────── defesa ───────────────────────────────

  /** p.106: Defesa = 10 + DES + armadura + escudo (+ efeitos "defesa"). */
  function calcularDefesa(personagem, efeitosResolvidos) {
    var d = (personagem && personagem.defesa) || { base: 10, usaAtributo: "DES", armadura: 0, escudo: 0, outros: 0 };
    var attrs = (personagem && personagem.atributos) || {};
    var partes = [{ rotulo: "Base", valor: num(d.base, 10) }];
    if (d.usaAtributo) partes.push({ rotulo: d.usaAtributo, valor: num(attrs[d.usaAtributo]) });
    if (num(d.armadura)) partes.push({ rotulo: "Armadura", valor: num(d.armadura) });
    if (num(d.escudo)) partes.push({ rotulo: "Escudo", valor: num(d.escudo) });
    if (num(d.outros)) partes.push({ rotulo: "Outros", valor: num(d.outros) });
    (efeitosResolvidos || []).forEach(function (e) {
      if (e.alvo === "defesa" && e.op === "soma" && !e.descartado) partes.push({ rotulo: e.origem ? e.origem.nome : "efeito", valor: num(e.valor) });
    });
    return { total: partes.reduce(function (s, x) { return s + x.valor; }, 0), partes: partes };
  }

  // ───────────────────────── calculadora de mesa ──────────────────

  /**
   * Avalia uma expressão de calculadora: inteiros e + − × ÷ (aceita também - * / x).
   * Sem eval(): tokeniza e faz duas passadas — × e ÷ primeiro, depois + e − (p.226: "aplique
   * primeiro multiplicações e divisões, depois somas e subtrações").
   * Cada ÷ arredonda para baixo NO PRÓPRIO PASSO (p.226–227: 26 → 13 → 6). `exato` é o valor
   * sem arredondar (para a dica "18,5 ↓").
   * "−" no início = número negativo. Operador no fim é ignorado (resultado "ao vivo").
   * @returns {{valor: number|null, exato: number|null, arredondou: boolean, erro: null|"divisaoPorZero"|"invalida", vazio: boolean}}
   */
  function calcular(expr) {
    var s = String(expr == null ? "" : expr).replace(/\s+/g, "")
      .replace(/[−–]/g, "-").replace(/[×xX*]/g, "*").replace(/[÷:\/]/g, "/");
    var out = { valor: null, exato: null, arredondou: false, erro: null, vazio: true };

  function stepper(campo, v) { return "<div class='stepper'><button data-a='step' data-c='" + campo + "' data-d='-1'>−</button><b class='num'>" + v + "</b><button data-a='step' data-c='" + campo + "' data-d='1'>+</button></div>"; }

  // ───────────── folhas ─────────────
  // Botão "voltar" do Android: fecha a folha aberta; na tela de combate/ficha, volta ao Início.
  var ignorarPop = 0;
  function abrir(s) {
    if (ignorarPop > 0) { setTimeout(function () { abrir(s); }, 60); return; }
    var ja = !!sheet; sheet = s; if (!ja) try { history.pushState({ folha: 1 }, ""); } catch (e) {} render();
  }
  function fechar(viaVoltar) { if (!sheet) return; sheet = null; render(); if (!viaVoltar) try { ignorarPop++; history.back(); setTimeout(function () { ignorarPop = 0; }, 400); } catch (e) {} }
  window.addEventListener("popstate", function () {
    if (ignorarPop > 0) { ignorarPop--; return; }
    if (sheet) { fechar(true); return; }
    if (S.ui.tela !== "inicio") { S.ui.tela = "inicio"; render(); try { history.pushState({ base: 1 }, ""); } catch (e) {} }
  });
  try { history.pushState({ base: 1 }, ""); } catch (e) {}
  var dupl = {};

  function termoHtml(t, filho) {

  function sheetAtaque() {
