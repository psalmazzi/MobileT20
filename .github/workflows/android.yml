name: APK Android

on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

# Duas execuções seguidas não podem apagar/recriar o release "apk" ao mesmo tempo.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEM_CHAVE_PROPRIA: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Colocar o app (web/index.html) dentro do APK
        run: cp web/index.html android/app/src/main/assets/index.html

      - name: Usar chave própria (opcional, via secrets)
        if: env.TEM_CHAVE_PROPRIA == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/minha-chave.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/minha-chave.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk CombateT20.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CombateT20-apk
          path: CombateT20.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar na página de Releases (link fixo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk CombateT20.apk \
            --target "${{ github.sha }}" \
            --title "Combate T20 — APK" \
            --notes "Versão 1.${{ github.run_number }}, gerada automaticamente a partir de ${{ github.sha }}. Instale o CombateT20.apk no Android (permita fontes desconhecidas)." \
            --latest
